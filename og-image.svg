<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#1a1d24" />
            <stop offset="100%" stop-color="#0b0c10" />
        </radialGradient>

        <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <mask id="trashcan-cutouts">
            <rect width="100" height="100" fill="white" />
            <rect x="10" y="30" width="80" height="4" fill="black" />
            <g stroke="black" stroke-width="5" stroke-linecap="round">
                <line x1="37" y1="44" x2="39" y2="86"/>
                <line x1="50" y1="44" x2="50" y2="86"/>
                <line x1="63" y1="44" x2="61" y2="86"/>
            </g>
        </mask>
    </defs>

    <rect width="1200" height="630" fill="url(#bg-grad)" />

    <rect x="2" y="2" width="1196" height="626" fill="none" stroke="#332d1d" stroke-width="4" />

    <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#c8a45c" stroke-opacity="0.25" stroke-width="1.5" />

    <path d="M 20 36 L 20 20 L 36 20" fill="none" stroke="#c8a45c" stroke-width="2" />
    <path d="M 1180 36 L 1180 20 L 1164 20" fill="none" stroke="#c8a45c" stroke-width="2" />
    <path d="M 20 594 L 20 610 L 36 610" fill="none" stroke="#c8a45c" stroke-width="2" />
    <path d="M 1180 594 L 1180 610 L 1164 610" fill="none" stroke="#c8a45c" stroke-width="2" />

    <g transform="translate(540, 130) scale(1.2)" fill="#c8a45c" filter="url(#gold-glow)">
        <g mask="url(#trashcan-cutouts)">
            <rect x="36" y="6" width="28" height="10" rx="3"/>
            <rect x="10" y="18" width="80" height="12" rx="4"/>
            <path d="M 18 34 L 24 90 C 24 94 28 98 33 98 H 67 C 72 98 76 94 76 90 L 82 34 Z"/>
        </g>
    </g>

    <text x="600" y="320"
          text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="54"
          font-weight="700"
          fill="#c8a45c"
          letter-spacing="1"
          filter="url(#gold-glow)">
        Elden Ring Enemy &amp; NPC Remover
    </text>

    <text x="600" y="390"
          text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="24"
          fill="#a0a5b5">
        An Elden Ring mod which helps remove any selected enemies / NPCs.
    </text>
</svg>

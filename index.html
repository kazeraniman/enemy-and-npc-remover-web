<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elden Ring Enemy and NPC Remover</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/main.js"></script>
</head>
<body>
<h1>Elden Ring Enemy and NPC Remover</h1>

<h2>Replaced Enemies / NPCs</h2>
<div class="table-container">
    <table id="replaced-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Tags</th>
            <th></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
<button id="clear-button">Clear</button>

<h2>Available Enemies / NPCs</h2>
<div class="table-container">
    <table id="available-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>ID</th>
            <th>Tags</th>
            <th></th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
<button id="download-button">Download Replacements</button>
</body>
</html>
